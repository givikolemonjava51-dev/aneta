<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>მენიუს სვაიპი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="მენიუ">
<meta name="theme-color" content="#EEEBE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#EEEBE3;
    --surface:#FFFFFF;
    --surface-2:#E2DDD0;
    --text:#211D16;
    --text-muted:#6E6656;
    --border:#D3CCBB;
    --accent:#A85A17;
    --accent-soft:#F0DCC0;
    --accent2:#28615A;
    --accent2-soft:#D9E8E4;
    --good:#3C7A44;
    --good-soft:#DCEBDC;
    --bad:#9B3A2C;
    --bad-soft:#F4DCD5;
    --dinner-soft:#E7D6DA;
    --shadow: 0 1px 2px rgba(33,29,22,0.06), 0 10px 30px rgba(33,29,22,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140F; --surface:#211D16; --surface-2:#2A2419;
      --text:#EFE9DD; --text-muted:#AFA48C; --border:#3B3323;
      --accent:#E2954E; --accent-soft:#3A2A16;
      --accent2:#5FAA9E; --accent2-soft:#1E322E;
      --good:#7BC183; --good-soft:#213A24;
      --bad:#E48A78; --bad-soft:#402420;
      --dinner-soft:#3A2530;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140F; --surface:#211D16; --surface-2:#2A2419;
    --text:#EFE9DD; --text-muted:#AFA48C; --border:#3B3323;
    --accent:#E2954E; --accent-soft:#3A2A16;
    --accent2:#5FAA9E; --accent2-soft:#1E322E;
    --good:#7BC183; --good-soft:#213A24;
    --bad:#E48A78; --bad-soft:#402420;
    --dinner-soft:#3A2530;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    padding:0 16px;
    padding-block: max(20px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    display:flex; justify-content:center;
    min-height:100vh; min-height:100dvh;
  }
  .app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px;}

  h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:1.9rem;margin:0;text-wrap:balance;line-height:1;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  header{display:flex;flex-direction:column;gap:6px;}
  header .sub{font-size:0.84rem;color:var(--text-muted);}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .tab{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;font-weight:600;padding:8px 12px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);white-space:nowrap;cursor:pointer;flex:none;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}

  .stage{position:relative;height:526px;overflow:visible;}
  .card{
    position:absolute; inset:0; overflow:hidden;
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    box-shadow:var(--shadow); padding:22px 22px 18px;
    display:flex; flex-direction:column; gap:10px;
    touch-action:none; user-select:none; cursor:grab;
    will-change:transform;
  }
  .card:active{cursor:grabbing;}
  .card .catlabel{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent2);font-weight:600;}
  .card h2{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:1.5rem;margin:2px 0 0;line-height:1.05;text-wrap:balance;}
  .card .desc{color:var(--text-muted);font-size:0.9rem;line-height:1.5;flex:1;min-height:0;overflow:hidden;}
  .thumb{width:100%;height:104px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:2px;flex:none;}
  .thumb svg{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.12));margin:0 -6px;}
  .thumb svg:nth-child(1){transform:rotate(-6deg);}
  .thumb svg:nth-child(3){transform:rotate(6deg);}
  .macros{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;}
  .mchip{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;padding:5px 10px;border-radius:8px;background:var(--surface-2);color:var(--text);}
  .mchip.kcal{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .stamp{position:absolute;top:20px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:0.05em;padding:4px 14px;border:4px solid;border-radius:10px;opacity:0;transform:rotate(-12deg);pointer-events:none;}
  .stamp.like{right:16px;color:var(--good);border-color:var(--good);}
  .stamp.nope{left:16px;color:var(--bad);border-color:var(--bad);transform:rotate(12deg);}

  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:20px;padding:24px;}
  .empty h2{font-family:'Big Shoulders Display',sans-serif;font-size:1.6rem;margin:0;}
  .empty p{color:var(--text-muted);font-size:0.9rem;margin:0;max-width:32ch;}

  .controls{display:flex;justify-content:center;align-items:center;gap:16px;}
  .ctrlbtn{
    width:58px;height:58px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;box-shadow:var(--shadow);
    color:var(--text);
  }
  .ctrlbtn.nope{color:var(--bad);}
  .ctrlbtn.like{color:var(--good);}
  .ctrlbtn.undo{width:44px;height:44px;font-size:1.1rem;color:var(--text-muted);}
  .ctrlbtn:active{transform:scale(0.92);}
  .ctrlbtn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}

  .progress{display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--text-muted);}

  .favwrap{border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:8px;}
  .favhead{display:flex;justify-content:space-between;align-items:center;}
  .favhead h3{font-family:'Big Shoulders Display',sans-serif;font-size:1.15rem;margin:0;}
  .favlist{display:flex;flex-direction:column;gap:6px;}
  .favitem{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:0.86rem;align-items:center;cursor:pointer;}
  .favitem:hover{border-color:var(--accent2);}
  .favitem:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}
  .favitem .fname{font-weight:600;}
  .favitem .fkcal{font-family:'IBM Plex Mono',monospace;color:var(--accent2);font-size:0.78rem;white-space:nowrap;}
  .favempty{color:var(--text-muted);font-size:0.84rem;}
  .clearbtn{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--text-muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}

  @media (max-width:400px){ .stage{height:502px;} }
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,17,12,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-backdrop[hidden]{display:none;}
  .modal-card{position:relative;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:24px 22px 22px;display:flex;flex-direction:column;gap:10px;}
  .modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-close:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}
  .modal-card .thumb{width:100%;height:104px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;}
  .modal-card .thumb svg{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.12));margin:0 -6px;}
  .modal-card .catlabel{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent2);font-weight:600;}
  .modal-card h2{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:1.5rem;margin:2px 24px 0 0;line-height:1.05;text-wrap:balance;}
  .modal-card .desc{color:var(--text-muted);font-size:0.92rem;line-height:1.5;}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="eyebrow">Swipe · მენიუს არჩევანი</div>
    <h1>მენიუს სვაიპი</h1>
    <div class="sub">დღიური სამიზნე: 1650–1700 კკალ. აირჩიე სვაიპით ერთი თითოეული კატეგორიიდან — უმეტესობა კომბინაციებისა 1600-1750-ში ხვდება, საშუალოდ ~1670-ზე.</div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <button class="ctrlbtn nope" id="btnNope" aria-label="არ მომწონს">✕</button>
    <button class="ctrlbtn undo" id="btnUndo" aria-label="დაბრუნება">↺</button>
    <button class="ctrlbtn like" id="btnLike" aria-label="მომწონს">❤</button>
  </div>

  <div class="progress">
    <span id="progressText" class="mono"></span>
    <span>← გადაასრიალე ან დააჭირე →</span>
  </div>

  <div class="favwrap">
    <div class="favhead">
      <h3 id="favTitle">მოწონებული</h3>
      <button class="clearbtn" id="btnClear">გასუფთავება</button>
    </div>
    <div class="favlist" id="favlist"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="დახურვა">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

      btn.addEventListener('click', resetDeck);
      empty.appendChild(btn);

    var visible = deck.slice(0,3);
    for (var i=visible.length-1;i>=0;i--){
      var card = makeCard(visible[i], 10+ (visible.length-i));

      card.style.transform = 'translateY('+(depth*8)+'px) scale('+(1-depth*0.035)+')';

  function commit(dir){
    if(deck.length===0) return;
    var item = deck[0];
    var topCard = stage.querySelector('.card');
    history.push({item:item, dir:dir});
    if(dir==='like'){
      var list = favorites[current];
      if(!list.some(function(f){return f.name===item.name;})){
        list.push({name:item.name, desc:item.desc, kcal:item.kcal, p:item.p, f:item.f, c:item.c, icons:item.icons});
        saveFavs();
      }
    }
    var finish = function(){
      deck = deck.slice(1);
      render();
    };
    if(topCard && !reduceMotion){
      topCard.style.transition = 'transform .35s ease, opacity .35s ease';
      var x = dir==='like' ? 600 : -600;
      topCard.style.transform = 'translateX('+x+'px) rotate('+(dir==='like'?20:-20)+'deg)';
      topCard.style.opacity = '0';
      setTimeout(finish, 260);
    } else {
      finish();
    }
  }

  function undo(){
    var last = history.pop();
    if(!last) return;
    if(last.dir==='like'){
      var list = favorites[current];
      var idx = list.findIndex(function(f){return f.name===last.item.name;});
      if(idx>-1){ list.splice(idx,1); saveFavs(); }
    }
    deck.unshift(last.item);
    render();
  }

  document.getElementById('btnLike').addEventListener('click', function(){ commit('like'); });
  document.getElementById('btnNope').addEventListener('click', function(){ commit('nope'); });
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnClear').addEventListener('click', function(){
    favorites[current] = [];
    saveFavs();
    renderFavs();
  });

  document.addEventListener('keydown', function(e){
    if(!modalBackdrop.hidden) return;
    if(e.key==='ArrowRight'){ commit('like'); }
    else if(e.key==='ArrowLeft'){ commit('nope'); }
    else if(e.key==='ArrowUp' || e.key==='z'){ undo(); }
  });

  function attachDrag(card){
    var startX=0, startY=0, dx=0, dy=0, dragging=false;
    var likeStamp = card.querySelector('.stamp.like');
    var nopeStamp = card.querySelector('.stamp.nope');

    function pointerDown(e){
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      card.style.transition = 'none';
      card.setPointerCapture && card.setPointerCapture(e.pointerId);
    }
    function pointerMove(e){
      if(!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      var rot = dx/18;
      card.style.transform = 'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)';
      var ratio = Math.min(Math.abs(dx)/120,1);
      if(dx>0){ likeStamp.style.opacity = ratio; nopeStamp.style.opacity=0; }
      else if(dx<0){ nopeStamp.style.opacity = ratio; likeStamp.style.opacity=0; }
    }
    function pointerUp(){
      if(!dragging) return;
      dragging=false;
      if(dx > 110){ commit('like'); }
      else if(dx < -110){ commit('nope'); }
      else {
        card.style.transition = 'transform .25s ease';
        card.style.transform = 'translate(0,0) rotate(0)';
        likeStamp.style.opacity=0; nopeStamp.style.opacity=0;
      }
      dx=0; dy=0;
    }
    card.addEventListener('pointerdown', pointerDown);
    card.addEventListener('pointermove', pointerMove);
    card.addEventListener('pointerup', pointerUp);
    card.addEventListener('pointercancel', pointerUp);
  }

  resetDeck();

})();
</script>
</body>
</html>
